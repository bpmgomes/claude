<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redefinir senha · AgendaFácil</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/forgot-password-page.js"></script>
</head>
<body>
  <main class="card account-recovery">
    <h1>Redefinir senha</h1>
    <p class="subtitle">Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required
               aria-describedby="email-error">
        <p class="field-error" id="email-error" data-field="email" aria-live="polite"></p>
      </div>

      <p class="form-error" id="form-error" role="alert" aria-live="polite" tabindex="-1"></p>

      <button type="submit" id="submit-button">Enviar link</button>
    </form>

    <p class="form-status" id="request-status" role="status" aria-live="polite" tabindex="-1"></p>

    <p class="secondary-link touch-link"><a href="/login">Voltar para entrar</a></p>
  </main>
</body>
</html>
