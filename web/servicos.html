<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços · AgendaFácil</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/servicos-page.js"></script>
</head>
<body>
  <main class="card">
    <img id="logo-preview" class="logo-thumb" alt="Logo do negócio" width="96" height="96" hidden>
    <h1 id="business-name">Carregando…</h1>
    <p class="subtitle">Serviços</p>
    <p class="secondary-link header-link"><a href="/profissionais">Profissionais</a></p>

    <div class="public-link-box" id="link-box" hidden>
      <p class="public-link-label">Seu link:</p>
      <a id="public-link" class="public-link" rel="noopener"></a>
    </div>

    <section id="services-section" hidden>
      <form id="service-form" novalidate>
        <h2 id="form-title" class="section-title">Novo serviço</h2>

        <div class="field">
          <label for="name">Nome do serviço</label>
          <input id="name" name="name" type="text" autocomplete="off" maxlength="100" required
                 aria-describedby="name-error">
          <p class="field-error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="durationMinutes">Duração</label>
          <select id="durationMinutes" name="durationMinutes" required aria-describedby="durationMinutes-error">
            <option value="">Selecione</option>
          </select>
          <p class="field-error" id="durationMinutes-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="price">Preço (R$)</label>
          <input id="price" name="price" type="text" inputmode="decimal" autocomplete="off" placeholder="50,00"
                 maxlength="20" aria-describedby="price-error">
          <p class="field-error" id="price-error" aria-live="polite"></p>
        </div>

        <div class="field field-checkbox">
          <input id="priceOnRequest" name="priceOnRequest" type="checkbox" aria-describedby="priceOnRequest-error">
          <label for="priceOnRequest">Sob consulta</label>
          <p class="field-error" id="priceOnRequest-error" aria-live="polite"></p>
        </div>

        <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
        <p class="help" id="save-status" aria-live="polite"></p>

        <button type="submit" id="submit-button">Adicionar serviço</button>
        <button type="button" id="cancel-edit" class="button-secondary button-spaced" hidden>Cancelar edição</button>
      </form>

      <div class="field list-filter">
        <label for="status-filter">Mostrar</label>
        <select id="status-filter" name="status">
          <option value="all">Todos</option>
          <option value="active">Ativos</option>
          <option value="inactive">Desativados</option>
        </select>
      </div>

      <p class="help" id="list-status" role="status" aria-live="polite"></p>
      <ul id="service-list" class="service-list"></ul>
    </section>

    <p class="secondary-link"><a href="/negocio">Editar dados do negócio</a></p>
    <button type="button" id="logout-button" class="button-secondary button-spaced">Sair</button>
  </main>
</body>
</html>
