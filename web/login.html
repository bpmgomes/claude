<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · AgendaFácil</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login-page.js"></script>
</head>
<body>
  <main class="card">
    <h1>Entrar</h1>
    <p class="subtitle">Acesse a agenda do seu negócio.</p>
    <p class="form-status" id="login-status" role="status" aria-live="polite" tabindex="-1"></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required
               aria-describedby="email-error">
        <p class="field-error" id="email-error" data-field="email" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               aria-describedby="password-error">
        <p class="field-error" id="password-error" data-field="password" aria-live="polite"></p>
      </div>

      <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>

      <button type="submit" id="submit-button">Entrar</button>
    </form>
    <!--forgot-password-->

    <p class="secondary-link">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p>
  </main>
</body>
</html>
